<!-- RAKTI CLOUD FIX - Makes student login work on phone (cloud not localStorage) -->
<script>
(function(){
  const API = window.location.origin + '/api';
  console.log('Rakti Cloud Fix: API', API);
  
  // Override localStorage logic with cloud API
  const originalSetItem = localStorage.setItem;
  
  // Add cloud login functions that original UI can call
  window.raktiCloudLogin = async function(adm_number, password){
    const res = await fetch(API + '/auth/student-login', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ adm_number, password })});
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    localStorage.setItem('rakti_student_token', data.token);
    localStorage.setItem('token', data.token);
    return data;
  };
  
  window.raktiCloudSignup = async function(adm_number, full_name, level, password){
    const res = await fetch(API + '/auth/student-signup', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ adm_number, full_name, level, password })});
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    localStorage.setItem('rakti_student_token', data.token);
    localStorage.setItem('token', data.token);
    return data;
  };
  
  // Intercept the original app's login attempt
  // The original app checks localStorage for students - we make it check cloud instead
  setTimeout(()=>{
    const loginBtn = document.querySelector('button');
    // Try to find login form and add cloud handler
    const observer = new MutationObserver(()=>{
      const errorEl = document.querySelector('[class*="Access Denied"]') || document.querySelector('p.text-red-500') || document.getElementById('loginError');
      if(errorEl && errorEl.textContent.includes('not found in admin records')){
        errorEl.innerHTML = errorEl.textContent + '<br><br><button onclick="tryCloudLogin()" style="background:#0F2E4A;color:white;padding:6px 12px;border-radius:8px;font-size:12px">Try Cloud Login (Fix for phone)</button>';
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  }, 1000);
  
  window.tryCloudLogin = async function(){
    const admInput = document.querySelector('input[type="text"]') || document.getElementById('loginAdm') || document.querySelector('input[placeholder*="9846"]') || document.querySelectorAll('input')[0];
    const passInput = document.querySelector('input[type="password"]') || document.getElementById('loginPass') || document.querySelectorAll('input')[1];
    const adm = admInput ? admInput.value.trim() : prompt('Enter Adm No (e.g 9846):');
    const pass = passInput ? passInput.value : prompt('Enter Password:');
    if(!adm || !pass){ alert('Adm No and password required'); return; }
    try{
      const data = await window.raktiCloudLogin(adm, pass);
      alert('Cloud login success! Balance: KES ' + (data.student?.balance || 'loaded') + '. Reloading...');
      location.reload();
    }catch(e){
      alert('Cloud login failed: ' + e.message + '\n\nMake sure admin admitted you on computer first, and Adm No + Name + Level match exactly.');
    }
  };
})();
</script>
